note: 'Lacuna publishes an unusually complete discovery surface: RFC 9727 api-catalog, RFC 8414 authorization
  server metadata, RFC 9728 protected resource metadata, RFC 9116 security.txt, an A2A agent card, an
  MCP server card, and a non-standard but agent-oriented /auth.md registration guide. The api-catalog
  is the entry point that leads to the OpenAPI at /api/openapi.json. Every path below was re-probed on
  2026-09-11 and every status is unchanged from the August round. Two documents changed content: the
  authorization-server metadata gained a `revocation_endpoint` (RFC 7009), a
  `revocation_endpoint_auth_methods_supported` list, the private
  `urn:lacuna:params:oauth:grant-type:apple-assertion` grant type and an `agent_auth.revocation_uri`;
  and /auth.md was substantially rewritten and expanded. security.txt Expires rolls forward
  automatically (now 2027-09-11), so the document is self-maintaining rather than stale. Both refreshed
  copies are saved here.'
