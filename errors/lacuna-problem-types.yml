      required: true
      enum:
        - invalid_request_error
        - authentication_error
        - permission_error
        - insufficient_credits
        - rate_limit_error
        - not_found
        - api_error
        - service_unavailable
    - name: code
      required: true
      description: Machine-readable specific code within the type.
    - name: message
      required: true
    - name: param
      required: false
      description: Field name when relevant.
    - name: model
      required: false
      description: Unavailable model codename when `code` is `model_unavailable`.
    - name: retry_after_seconds
      required: false
      description: Suggested delay before retrying when the error is retryable.
