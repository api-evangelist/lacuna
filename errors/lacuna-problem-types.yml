precondition_checks:
  note: >-
    Three of the eight error classes below — 401 (credential state), 402 (insufficient_credits) and 403
    (tier_insufficient / insufficient_scope) — became avoidable this round. GET /v1/me returns the
    credential kind, its scopes, its expiry, the account plan and the credit balance at no credit cost,
    so an agent can establish every one of those preconditions before it issues a billable POST instead
    of discovering them from a rejection.
  operation: getMe
  covers: [401 key_expired, 402 insufficient_credits, 403 tier_insufficient, 403 insufficient_scope]
task_level_errors:
  note: >-
    A task that reaches `status: failed` carries a non-null `error` object with `code` and `message` on
    the GenerationTask itself (not an HTTP error), and credits are refunded automatically.
  schema: '#/components/schemas/GenerationTask/properties/error'
