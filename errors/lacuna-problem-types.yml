note: >-
  Lacuna does NOT use RFC 9457 application/problem+json. Every error is an application/json body with a
  single `error` object carrying `type`, `code`, `message`, and optionally `param`, `model` and
  `retry_after_seconds` — the envelope the OpenAPI info description calls "OpenAI-style".
