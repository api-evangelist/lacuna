scope: per API key
rate_limits:
  - name: Requests per minute
    limit_count: 60
    limit_period: minute
    scope: per API key
    on_exceed:
      http_status: 429
      error_code: rpm_exceeded
      headers: [Retry-After]
  - name: Concurrent generations (Pro)
    limit_count: 10
    limit_period: concurrent
    scope: per API key
    plan: Pro
    on_exceed:
      http_status: 429
      error_code: concurrent_limit_exceeded
      headers: [Retry-After]
  - name: Concurrent generations (Ultra)
    limit_count: 20
    limit_period: concurrent
    scope: per API key
    plan: Ultra
    on_exceed:
      http_status: 429
      error_code: concurrent_limit_exceeded
      headers: [Retry-After]
overrides: Account-specific concurrency overrides may apply.
quota:
  unit: credits
  note: >-
    Beyond request rate, every generation consumes plan credits — aether 50, echo 80, nocturne 180 per
    request. Exhaustion is a 402 insufficient_credits, not a 429.
signaling:
  headers_on_success: none published
  headers_on_429: [Retry-After]
  standard_headers: none — no X-RateLimit-* or RFC 9331 RateLimit-* fields are documented or observed
  note: >-
    There is no runtime budget signal. A caller learns nothing about remaining quota from a successful
    response; it only finds out it has run out when a 429 arrives, and the only machine-readable field
    on that 429 is Retry-After. This is the weakest part of an otherwise strong agent posture.
introspection:
  operation: getMe
  path: GET /v1/me
  cost: free — no credits consumed
  returns:
    - rate_limits.requests_per_minute
    - rate_limits.concurrent_generations
  added: between 2026-08-09 and 2026-09-11 (no changelog entry)
  note: >-
    New this round and materially useful, because the published numbers are defaults and the spec says
    account-specific overrides may apply — so the docs cannot be trusted as the effective limit for a
    given key, and until now nothing else could be. This is discovery-time introspection, not runtime
    signalling: it tells an agent its ceiling, never its remaining headroom.
limit_count: 3
