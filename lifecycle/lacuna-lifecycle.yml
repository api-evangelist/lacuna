  note: >-
    No deprecation or sunset policy is published, and no operation carries `deprecated: true`. The only
    deprecation-shaped signal in the whole surface is prose on one enum value: the `nocturne` model is
    described in GenerateRequest as retained "for backward compatibility and not recommended for new
    integrations", with no removal date. That is a soft steer, not a policy, so this repo deliberately
    emits no `Deprecation` pointer.
