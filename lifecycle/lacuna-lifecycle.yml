  docs: https://www.lacuna.fm/docs/api
  note: >-
    Paths are /v1/music/generations while the OpenAPI info.version is 0.1.0 — the URL contract is v1 but
    the document declares itself pre-release. No version-negotiation header, date-pinning, or release
    train is documented. Re-read 2026-09-11: info.version is STILL 0.1.0 even though an operation was
    added (GET /v1/me), so the document version does not move with the contract and cannot be used to
    detect change. Diffing the spec is the only way to know it moved — which is how this round found it.
