      has stopped naming it entirely — the 2026-08-23 entry describes the model line-up to users as
      Reverie, Aether and Echo. A soft deprecation with no clock, now diverging from what the product
      tells its own users.
model_catalog_drift:
  detected: '2026-09-11'
  severity: notable
  api_enum: [aether, echo, nocturne]
  mcp_enum: [aether, echo]
  product_changelog: [reverie, aether, echo]
  note: >-
    Three surfaces publish three different model catalogs. `reverie`, introduced to users on 2026-08-23
    and described as following supplied wording closely, is absent from both the OpenAPI and the MCP
    tool schema; `nocturne` persists in the OpenAPI alone. An integrator reading the contract cannot
    reach the model the marketing page recommends, and cannot tell that the model the contract offers
    has been retired from the product narrative. There is no models endpoint on REST to arbitrate — the
    hosted MCP server's `list_models` tool is the only machine-readable catalog, and it does not agree
    with the OpenAPI either.
