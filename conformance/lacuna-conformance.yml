  - id: domain-standard-music-industry
    conforms: false
    evidence: >-
      REWARD-ONLY CHECK, assessed and not met. Recorded-music interchange has real standards — DDEX
      (ERN/RIN/MEAD) for release and recording metadata, ISRC (ISO 3901) for recording identifiers, ISWC
      for works, CWR for publishing registration, and MusicXML/MIDI for notation. Lacuna's contract
      declares none of them: GenerationTask and Track carry only id, audio_url, duration, title, lyrics,
      image_url, tags and index, with no ISRC field, no DDEX message shape and no rights/ownership
      metadata, and the commercial licence is issued as a PDF certificate rather than as structured
      data. MusicXML and MIDI appear in the product (sheet-music and MIDI conversion tools) but not in
      the API contract, which is music-generation only. This is a gap worth naming rather than a
      penalty: a buyer who already speaks DDEX/ISRC needs a bespoke connector to get Lacuna output into
      a catalog, distribution or royalty system.
