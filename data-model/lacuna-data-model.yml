implicit_entities:
  note: >-
    Partially closed this round. Credits, the presenting API key and the subscription plan are now
    READABLE as nested objects on Account (credits.total, auth.key.expires_at, plan) — but only for the
    caller, and only for reading. None of them is a resource you can address, list or mutate: there is
    no /v1/keys to rotate a credential, no /v1/credits to top up, no /v1/models to enumerate the model
    catalog (the MCP server exposes list_models; REST does not), and no way to list your own past
    generations.
