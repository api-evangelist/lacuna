    title: A mashup maker that refuses the pairs that won't work, and an API for the song generator
    api_relevant: true
    breaking: false
    additions:
      - Public music-generation API with quickstart docs and an MCP guide.
      - Rebuilt API key management page.
      - Mashup Maker — vocal from one track over the instrumental of another, tempo/key/bar-line matched.
      - Incompatible pairs refused and refunded rather than rendered; re-balances re-render free.
