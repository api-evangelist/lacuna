    title: Point an AI assistant straight at the song generator, and hear back when a job lands
    api_relevant: true
    breaking: false
    additions:
      - Hosted MCP endpoint at https://www.lacuna.fm/mcp — no local install, connect and authenticate once.
      - A2A endpoint answering both dialects in circulation, alongside MCP.
      - Discovery files published so agents can find both surfaces unaided.
      - In-browser tools registered site-wide instead of only on the song-creation form, including a models listing page.
      - Completion/failure notifications extended to stem splits, mastering, artwork and mixdowns.
      - Unread markers on projects that finished while away.
