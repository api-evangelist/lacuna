    rest: [createGeneration, getGeneration]
    binding: rest
    confidence: medium
    note: >-
      The A2A skill is a composite — the card documents submit-then-poll via tasks/get, which maps onto
      both REST operations. It also accepts a plain text part that is treated as a style description and
      rendered instrumental, a coercion with no REST equivalent.
mcp_only:
  - tool: list_models
    reason: >-
      Returns the available music models with credit cost per task, tracks produced per task and
