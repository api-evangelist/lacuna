description: >-
  Binds every Lacuna MCP tool and A2A skill to its backing OpenAPI operation. The MCP tool input schemas
  were read live and anonymously from tools/list, so the bindings below were checked field-by-field
  against the OpenAPI request bodies rather than inferred from names.
surfaces:
  openapi:
    file: openapi/_original/lacuna-music-openapi-original.json
    url: https://www.lacuna.fm/api/openapi.json
    operations: 3
    gated: false
    note: >-
      Three operations as of 2026-09-11 — createGeneration, getGeneration and the newly published
      getMe. The August round recorded two.
  mcp:
    url: https://www.lacuna.fm/mcp
    transport: streamable-http
    tools_list_gated: false
    note: initialize + tools/list are anonymous; tools/call requires music:generate or an API key.
  a2a:
    url: https://www.lacuna.fm/a2a
    gated: true
    note: Every A2A method requires auth; an anonymous message/send returned 401.
  graphql: null
crosswalk:
  - tool: generate_music
    surface: mcp
    category: music-generation
    rest: [createGeneration]
    binding: rest
    confidence: high
    note: >-
      Input schema is a field-for-field match against the OpenAPI GenerateRequest — style, title,
      lyrics, instrumental, model, vocal_gender, negative_tags, style_weight, weirdness_constraint,
      audio_weight, required [style, title], additionalProperties false. One real divergence: the MCP
      model enum is [aether, echo] while the OpenAPI GenerateRequest enum also carries `nocturne`
      (180 credits, and marked in the spec as retained for backward compatibility and not recommended
      for new integrations). The MCP surface exposes the narrower, current model set.
  - tool: get_generation
    surface: mcp
    category: music-generation
    rest: [getGeneration]
    binding: rest
    confidence: high
    note: Single `id` string parameter, matching the OpenAPI path parameter.
  - skill: generate_music
    surface: a2a
    category: music-generation
    rest: [createGeneration, getGeneration]
    binding: rest
    confidence: medium
    note: >-
      The A2A skill is a composite — the card documents submit-then-poll via tasks/get, which maps onto
      both REST operations. It also accepts a plain text part that is treated as a style description and
      rendered instrumental, a coercion with no REST equivalent.
mcp_only:
  - tool: list_models
    reason: >-
      Returns the available music models with credit cost per task, tracks produced per task and
      language coverage. No public REST operation exposes a models catalog — the OpenAPI only documents
      the model enum inline on GenerateRequest and a credits table in the info description.
  - tool: wait_for_generation
    surface: stdio (npm lacuna-mcp)
    reason: >-
      Blocking poll helper published by the local stdio server (and named in the provider's Agent Skill)
      but absent from the hosted server's tools/list. Client-side composition over getGeneration, not a
      distinct API operation.
rest_only:
  - operation: getMe
    path: GET /v1/me
    reason: >-
      The account/credential introspection operation published to the REST spec since the August round
      has no counterpart on either agent surface. A live anonymous tools/list on 2026-09-11 returned the
      same three tools as in August — generate_music, get_generation, list_models — so an MCP client
      still cannot ask what plan it is on, how many credits remain, what scopes it holds or when its key
      expires, while a REST caller now can, for free.
    impact: >-
      This inverts the usual gap in this catalog. The agent surface is normally the thinner one because
      it lags a large REST API; here the REST surface has three operations and the MCP surface covers
      two of them, but the one it misses is precisely the precondition check an autonomous agent needs
      most before spending credits.
divergences:
  - The hosted MCP server and the npm stdio server expose different tool sets (list_models vs wait_for_generation).
  - The `nocturne` model is in the OpenAPI enum but not in the MCP generate_music enum.
  - A2A exposes one coarse skill; MCP exposes three fine-grained tools over the same core.
  - >-
    REST gained getMe (free credential/plan/credit/rate-limit introspection); neither the hosted MCP
    server nor the A2A card exposes an equivalent. Re-probed live 2026-09-11.
