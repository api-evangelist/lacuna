name: Lacuna
description: >-
  Lacuna (lacuna.fm), operated by JOYLINK LTD, is an AI music creation platform that turns lyrics or a plain-text style
  description into complete songs with vocals, alongside lyrics writing, word-level timed lyrics (LRC/SRT/VTT), lyric
  video export, AI mastering, mashups, stem separation, album-cover art, MIDI tooling and sheet-music conversion, plus
  long-form AI radio for focus, sleep and ambience. Developers get a documented REST music-generation API (OpenAPI 3.1
  published at /api/openapi.json), an official TypeScript SDK, a `lacuna` CLI, and an unusually complete agent surface:
  a hosted Streamable-HTTP MCP server at /mcp with an anonymous tools/list, an A2A JSON-RPC agent endpoint at /a2a with a
  published agent card, an RFC 9727 api-catalog, RFC 8414 / RFC 9728 OAuth discovery, an agent-oriented auth.md, an
  llms.txt, and a packaged Agent Skill. API access requires a Pro plan or above and is billed in credits per generation.
url: https://lacuna.apievangelist.com/apis.yml
